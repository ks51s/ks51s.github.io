<title>Apple Device Identifiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
* { box-sizing: border-box; }

:root{
  color-scheme:Dark;
  --primary:#aac7ff; --on-primary:#052e6a;
  --surface:#111318; --surface-container:#1d1f25; --surface-container-high:#262930;
  --on-surface:#e3e2e9; --on-surface-variant:#c4c6d0;
  --outline:#43474f; --shape-fill:#191926;
}
:root[data-theme="Light"]{
  color-scheme:Light;
  --primary:#3a5f92; --on-primary:#ffffff;
  --surface:#f8f9ff; --surface-container:#eceef5; --surface-container-high:#e1e3eb;
  --on-surface:#1a1c20; --on-surface-variant:#45474e;
  --outline:#c5c7d0; --shape-fill:#d8dcf0;
}

html, body{ min-width:100%; margin:0; }
html{ scroll-padding-top:120px; }
body{
  min-height:100svh; background:var(--surface); color:var(--on-surface);
  font-family:"Google Sans", -apple-system, sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background .25s ease, color .25s ease;
}

.shapes{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.shape{ position:absolute; top:0; left:0; width:390px; height:390px; opacity:.55; will-change:transform; }
.shape path{ fill:var(--shape-fill); transition:fill .25s ease; }
.shape--three{ width:280px; height:280px; }
.shape--four{ width:310px; height:310px; }
.shape--five{ width:380px; height:380px; }
@media (prefers-reduced-motion: reduce){ .shape{ display:none; } }

.dock{
  position:fixed; z-index:5; top:20px; right:24px; left:24px;
  min-height:64px; display:flex; align-items:center; justify-content:space-between;
  padding:8px 12px 8px 24px; border-radius:32px; background:var(--surface-container);
  max-width:672px; margin:0 auto;
}
.brand{ color:var(--on-surface); font-size:20px; line-height:1; font-weight:500; letter-spacing:-.03em; }
.theme-toggle{ display:flex; align-items:center; gap:4px; }
.theme-toggle button{
  display:inline-flex; align-items:center; justify-content:center; height:40px; padding:0 16px;
  color:var(--primary); background:transparent; border:none; border-radius:20px;
  font-family:inherit; font-size:14px; font-weight:500; cursor:pointer;
  transition:background-color .15s ease, color .15s ease, transform .1s ease;
}
.theme-toggle button:hover{ background-color:rgba(170,199,255,.08); }
.theme-toggle button:active{ transform:scale(.97); }
.theme-toggle button.active{ background:var(--surface-container-high); color:var(--on-surface); }

.wrap{ position:relative; z-index:2; max-width:672px; margin:0 auto; padding:132px 24px 90px; }

.hero{ text-align:center; margin-bottom:48px; }
h1{
  margin:0; font-size:clamp(38px,7vw,64px); line-height:.98; font-weight:500;
  letter-spacing:-.045em; color:var(--on-surface);
}
.sub{
  max-width:520px; margin:20px auto 0; color:var(--on-surface-variant);
  font-size:clamp(17px,2vw,20px); line-height:1.45; font-weight:400; letter-spacing:-.015em;
}

.card{
  background:var(--surface-container); border-radius:28px; padding:28px; margin-bottom:20px;
}
.field{ margin-bottom:18px; }
.field:last-child{ margin-bottom:0; }
label{ display:block; font-size:13px; font-weight:500; color:var(--on-surface-variant); margin-bottom:8px; letter-spacing:-.01em; }
.select-wrap{ position:relative; }
select{
  appearance:none; width:100%; font-family:inherit; font-size:16px; font-weight:400;
  color:var(--on-surface); background:var(--surface); border:1px solid var(--outline);
  border-radius:16px; padding:14px 42px 14px 16px; cursor:pointer;
  transition:border-color .15s ease;
}
select:focus-visible{ outline:none; border-color:var(--primary); }
.select-wrap::after{
  content:""; position:absolute; right:16px; top:50%; width:9px; height:9px;
  border-right:2px solid var(--on-surface-variant); border-bottom:2px solid var(--on-surface-variant);
  transform:translateY(-65%) rotate(45deg); pointer-events:none;
}

.result-card{ background:var(--surface-container); border-radius:28px; padding:28px 28px 0px; display:none; }
.result-card.show{ display:block; }
.result-title{ font-size:20px; font-weight:500; letter-spacing:-.02em; margin:0 0 4px; color:var(--on-surface); }
.result-sub{ color:var(--on-surface-variant); font-size:14px; letter-spacing:-.006em; margin:0 0 18px; }
.ids{
  background:var(--surface); border:1px solid var(--outline); border-radius:20px; padding:20px;
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
}
.id-chip{
  display:inline-flex; align-items:center; justify-content:center; height:40px; padding:0 16px;
  background:transparent; color:var(--primary); border:1px solid var(--primary);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; font-weight:500;
  letter-spacing:-.01em; border-radius:20px; cursor:copy; user-select:all;
  transition:background-color .15s ease, transform .1s ease;
}
.id-chip:hover{ background-color:rgba(170,199,255,.08); }
:root[data-theme="Light"] .id-chip:hover{ background-color:rgba(58,95,146,.08); }
.id-chip:active{ transform:scale(.96); }
.copied-toast{ font-size:12px; color:var(--on-surface-variant); text-align:center; margin-top:12px; height:16px; }

.sukablyat{ color:var(--on-surface-variant); font-size:13px; margin:18px 4px 0; letter-spacing:-.005em; }
footer{ position:relative; z-index:2; color:var(--on-surface-variant); font-size:12px; text-align:center; margin-top:56px; line-height:1.6; }

@media (max-width: 640px){
  .dock{ top:12px; right:12px; left:12px; min-height:56px; padding:8px 8px 8px 20px; }
  .brand{ font-size:16px; }
  .wrap{ padding-top:104px; }
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
}

.apple{
  width:22px;
  height:22px;
  fill:currentColor;
  display:block;
  margin-top:-4px;
}

.theme-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:40px;
  min-width:72px;
  padding:0 18px;
  color:var(--on-surface);
  background:var(--surface-container-high);
  border:none;
  border-radius:20px;
  font-family:inherit;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:transform .1s ease, background .15s ease;
}

.theme-btn:active{
  transform:scale(.97);
}
</style>
</head>

Simulator|Simulator|i386;x86_64
`.trim();

const records = RAW.split("\n").map(line=>{
  const [type,name,ids] = line.split("|");
  return {type,name,ids:ids.split(";")};
});

const types = [...new Set(records.map(r=>r.type))];
const typeSel = document.getElementById("deviceType");
const nameSel = document.getElementById("deviceName");
const resultCard = document.getElementById("resultCard");
const resultTitle = document.getElementById("resultTitle");
const idsBox = document.getElementById("idsBox");
const toast = document.getElementById("toast");

types.forEach(t=>{
  const o = document.createElement("option");
  o.value=t; o.textContent=t;
  typeSel.appendChild(o);
});

function populateNames(){
  const t = typeSel.value;
  nameSel.innerHTML="";
  records.filter(r=>r.type===t).forEach(r=>{
    const o = document.createElement("option");
    o.value=r.name; o.textContent=r.name;
    nameSel.appendChild(o);
  });
  showResult();
}

function showResult(){
  const t = typeSel.value, n = nameSel.value;
  const rec = records.find(r=>r.type===t && r.name===n);
  if(!rec){ resultCard.classList.remove("show"); return; }
  resultTitle.textContent = rec.name;
  idsBox.innerHTML="";
  rec.ids.forEach(id=>{
    const chip = document.createElement("span");
    chip.className="id-chip";
    chip.textContent=id;
    chip.title="Tap to copy";
    chip.addEventListener("click", ()=>{
      navigator.clipboard?.writeText(id).catch(()=>{});
      toast.textContent = `Copied ${id}`;
      setTimeout(()=>{ if(toast.textContent===`Copied ${id}`) toast.textContent=""; },1600);
    });
    idsBox.appendChild(chip);
  });
  resultCard.classList.add("show");
}

typeSel.addEventListener("change", populateNames);
nameSel.addEventListener("change", showResult);
typeSel.value = "iPad";
populateNames();

const themeToggle = document.getElementById("themeToggle");

function setTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  themeToggle.textContent = mode;
  try{
    localStorage.setItem("theme-pref", mode);
  }catch(e){}
}

let savedTheme = "Dark";
try{
  savedTheme = localStorage.getItem("theme-pref") || "Dark";
}catch(e){}

setTheme(savedTheme);

themeToggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme") || "Dark";
  setTheme(current === "Dark" ? "Light" : "Dark");
});

// floating background shapes
const shapes = document.querySelectorAll('.shape');
const states = new WeakMap();

function randomBetween(min, max){ return min + Math.random() * (max - min); }
function clampVal(value, min, max){ return Math.max(min, Math.min(max, value)); }

function createRandomState(){
  return { x: randomBetween(-12, 78), y: randomBetween(-12, 68), r: randomBetween(-12, 12), s: randomBetween(0.92, 1.05) };
}
function nextState(state){
  return {
    x: clampVal(state.x + randomBetween(-7, 7), -18, 82),
    y: clampVal(state.y + randomBetween(-6, 6), -18, 72),
    r: clampVal(state.r + randomBetween(-8, 8), -24, 24),
    s: clampVal(state.s + randomBetween(-0.025, 0.025), 0.88, 1.08)
  };
}
function applyState(shape, state, duration){
  shape.style.transition = `transform ${duration}s cubic-bezier(0.22, 0.61, 0.36, 1)`;
  shape.style.transform = `translate(${state.x}vw, ${state.y}vh) rotate(${state.r}deg) scale(${state.s})`;
}
function move(shape){
  const current = states.get(shape);
  const state = nextState(current);
  const duration = randomBetween(8, 14);
  states.set(shape, state);
  applyState(shape, state, duration);
  setTimeout(() => move(shape), duration * 1000);
}
shapes.forEach((shape, index) => {
  const state = createRandomState();
  states.set(shape, state);
  applyState(shape, state, 0);
  setTimeout(() => move(shape), 150 + index * 350 + randomBetween(0, 500));
});
</script>
